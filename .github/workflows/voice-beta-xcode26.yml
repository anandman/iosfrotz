name: Unsigned voice beta (Xcode 26)

on:
  push:
    branches: [codex/testflight-xcode26]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'anandman/iosfrotz'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify stable SDK and install locked dependencies
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.5'
          pod install --deployment
      - name: Test on iPhone and iPad
        env:
          TEST_RUNNER_FROTZ_TEST_LIVE_SPEECH: '1'
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = devices['com.apple.CoreSimulator.SimRuntime.iOS-26-5']
          for kind, name in [('phone', 'iPhone 17 Pro'), ('tablet', 'iPad Pro 11-inch (M5)')]:
              device = next(d for d in candidates if d['name'] == name)
              args = ['xcodebuild', '-workspace', 'Frotz.xcworkspace', '-scheme', 'Frotz', '-configuration', 'Debug', '-destination', 'platform=iOS Simulator,id='+device['udid'], '-derivedDataPath', 'ci-derived', '-resultBundlePath', 'artifacts/'+kind+'.xcresult', 'CODE_SIGNING_ALLOWED=NO', 'IPHONEOS_DEPLOYMENT_TARGET=13.0', 'test']
              with open('artifacts/'+kind+'.log', 'w') as log:
                  subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, check=True)
          PY
          ditto -c -k --keepParent ci-derived/Build/Products/Debug-iphonesimulator/Frotz.app artifacts/Frotz-simulator.zip
      - name: Archive build 7 without signing credentials
        run: |
          python3 - <<'PY'
          import plistlib
          with open('Info.plist', 'rb') as f:
              info = plistlib.load(f)
          info.update(CFBundleVersion='7', CFBundleShortVersionString='1.8.9', CFBundleDisplayName='Frotz Voice', CFBundleName='Frotz Voice', ITSAppUsesNonExemptEncryption=False)
          with open('/tmp/FrotzVoice7-Info.plist', 'wb') as f:
              plistlib.dump(info, f)
          PY
          xcodebuild -workspace Frotz.xcworkspace -scheme Frotz -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/FrotzVoice7.xcarchive -derivedDataPath ci-release CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=13.0 PRODUCT_BUNDLE_IDENTIFIER=design.highgain.Frotz INFOPLIST_FILE=/tmp/FrotzVoice7-Info.plist clean archive > artifacts/archive.log 2>&1
          ditto -c -k --keepParent artifacts/FrotzVoice7.xcarchive artifacts/FrotzVoice7-unsigned.zip
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrotzVoice7-unsigned
          path: |
            artifacts/*.zip
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.xcresult
          retention-days: 7
          if-no-files-found: error
