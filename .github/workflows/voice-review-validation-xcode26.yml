name: Voice feature gate matrix (Xcode 26)
on:
  push:
    branches: [codex/voice-review-validation]
permissions:
  contents: read
jobs:
  gates:
    if: github.repository == 'anandman/iosfrotz'
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        features: ['00', '01', '10', '11']
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify SDK and locked dependencies
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.2'
          gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - name: Verify each compiled feature combination on phone and tablet
        run: |
          python3 - <<'PY'
          import subprocess,json,os,pathlib
          out=pathlib.Path('artifacts');out.mkdir()
          def output(args):return subprocess.check_output(args,text=True)
          runtime=next(r for r in json.loads(output(['xcrun','simctl','list','runtimes','--json']))['runtimes'] if r.get('isAvailable') and r.get('version')=='26.2' and 'iOS' in r['name'])
          types=json.loads(output(['xcrun','simctl','list','devicetypes','--json']))['devicetypes']
          features=os.environ['FEATURES'];assert features in ['00','01','10','11']
          for kind in ['phone','tablet']:
              device=next(t for t in reversed(types) if ('iPhone 17 Pro' in t['name'] if kind=='phone' else 'iPad Pro' in t['name'] and '11-inch' in t['name']))
              uid=output(['xcrun','simctl','create','Frotz gates '+features+' '+kind,device['identifier'],runtime['identifier']]).strip()
              subprocess.run(['xcrun','simctl','boot',uid],check=True)
              subprocess.run(['xcrun','simctl','bootstatus',uid,'-b'],check=True)
              result='artifacts/'+kind+'.xcresult'
              args=['xcodebuild','test' if kind=='phone' else 'test-without-building','-workspace','Frotz.xcworkspace','-scheme','Frotz','-configuration','Debug','-destination','id='+uid,'-derivedDataPath','ci-gates','-resultBundlePath',result,'-parallel-testing-enabled','NO','CODE_SIGNING_ALLOWED=NO','IPHONEOS_DEPLOYMENT_TARGET=13.0','GCC_PREPROCESSOR_DEFINITIONS=$(inherited) FROTZ_ENABLE_NARRATION='+features[0]+' FROTZ_ENABLE_DICTATION='+features[1],'-only-testing:FrotzVoiceTests/VoiceFeatureGateTests']
              with (out/(kind+'.log')).open('w') as log:code=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,timeout=1200).returncode
              summary=json.loads(output(['xcrun','xcresulttool','get','test-results','summary','--path',result,'--format','json']))
              receipt={'features':features,'device':kind,'exit':code,'summary':summary}
              (out/(kind+'-summary.json')).write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))
              assert code==0 and summary['totalTestCount']==5 and summary['passedTests']==5 and summary['failedTests']==0 and summary['skippedTests']==0
              subprocess.run(['xcrun','simctl','shutdown',uid],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-gates-${{ matrix.features }}
          path: artifacts/
          retention-days: 3
